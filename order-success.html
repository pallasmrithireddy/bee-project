
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation | ATMA Beekeeper</title>
  <link rel="stylesheet" href="base.css">

  <link rel="stylesheet" href="footer.css">

<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container status-container">
      <div class="status-card">
        <div class="status-icon success-icon" aria-hidden="true">✓</div>
        <span class="eyebrow">Thank you for choosing ATMA</span>
        <h1>Your demo order is confirmed!</h1>
        <p>
          The simulated payment was successful. This is a test order,
          not a real payment or a verified dispatch.
        </p>

        <div id="success-order-details" class="status-order-details"></div>

        <div class="status-actions">
          <a class="btn btn-primary" href="order-details.html">View Order Details</a>
          <a class="btn btn-outline" href="invoice.html">View Demo Invoice</a>
          <a class="btn btn-outline" href="products.html">Continue Shopping</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="navigation.js"></script>
  <script src="main.js"></script>
  <script src="order.js"></script>

</html>
